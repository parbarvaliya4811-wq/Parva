[platformio]
default_envs = cyd, cyd2usb

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.0.4
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000

; Standard CYD (1 USB port, ILI9341)
[env:cyd]
build_flags = ${env.build_flags}
  -DILI9341_2_DRIVER=1

; CYD with 2 USB ports (micro + USB-C, ST7789)
[env:cyd2usb]
build_flags = ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
